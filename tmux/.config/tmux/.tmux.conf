# Tmux Configuration

# Increase scrollback buffer size
set-option -g history-limit 10000

# Enable mouse mode
set-option -g mouse on

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Prefix key set to 'C-b' (default)

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config file with prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Enable true color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Status bar configuration
set -g status-style 'bg=colour235,fg=colour136'
set -g status-left-length 40
set -g status-left '#[fg=colour46,bold]#S #[fg=colour240]| #[fg=colour75]#I:#P'
set -g status-right '#[fg=colour240]| #[fg=colour75]%Y-%m-%d %H:%M'

# Window status
setw -g window-status-current-style 'fg=colour166,bold'

# Pane border
set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style 'fg=colour166'

# Clock mode
setw -g clock-mode-colour colour64

# Copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ============================================
# macOS Specific Configuration
# ============================================

# macOS clipboard integration
# Install reattach-to-user-namespace via: brew install reattach-to-user-namespace
if-shell "command -v reattach-to-user-namespace > /dev/null 2>&1" \
    'set -g default-command "reattach-to-user-namespace -l $SHELL"'

# Use pbcopy and pbpaste for clipboard integration
set -g set-clipboard on
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "pbcopy && tmux display-message 'Copied to clipboard!'"

# Paste from macOS clipboard with prefix + p
bind p run-shell "pbpaste | tmux load-buffer - && tmux paste-buffer"

# Better integration with macOS Mission Control
# Use prefix + m to toggle mouse mode (useful for selecting text)
bind m set -g mouse \; display-message "Mouse mode: #{?mouse,on,off}"

# macOS specific keybindings
# Use Cmd key equivalents where possible (requires terminal support)
# Option + arrow for word navigation in terminal mode
bind -n M-Left send-keys "Esc b"
bind -n M-Right send-keys "Esc f"
