# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Tmux Configuration - macOS Optimized + Catppuccin Mocha
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ─── Plugins (TPM) ──────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Catppuccin Mocha theme
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_left_separator "▎"
set -g @catppuccin_window_right_separator " ▎"
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_text "#{b:pane_current_path}"
set -g @catppuccin_status_time_style "%I:%M %p"

# Session persistence
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh,node,npm,pnpm,yarn,bun,python3,bash,zsh,fish,nvim'
set -g @continuum-restore 'on'

# ─── Core Performance ───────────────────────────────────────────────────
set -sg escape-time 0
set -g history-limit 100000
set -g focus-events on
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"
set -g assume-paste-time 1
set -g renumber-windows on
set -g detach-on-destroy off

# ─── Prefix & Reload ───────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind r source-file ~/.config/tmux/.tmux.conf \; display-message "⚡ Config Reloaded"

# ─── Window & Pane Indexing ───────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1

# ─── Vim-style Navigation ──────────────────────────────────────────────
setw -g mode-keys vi

# Split panes (vim-style)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes without prefix (vim keys)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Navigate with prefix + vim keys too
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Swap panes
bind -r C-h swap-pane -L
bind -r C-l swap-pane -R
bind -r C-j swap-pane -D
bind -r C-k swap-pane -U

# ─── Copy Mode ─────────────────────────────────────────────────────────
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi r send-keys -X rectangle-toggle
bind -T copy-mode-vi / command-prompt -p "Search down:" "send -X search-forward \"%%%\""
bind -T copy-mode-vi ? command-prompt -p "Search up:" "send -X search-backward \"%%%\""

# ─── Mouse ─────────────────────────────────────────────────────────────
set -g mouse on

# ─── macOS Clipboard Integration ──────────────────────────────────────
if-shell "command -v reattach-to-user-namespace > /dev/null 2>&1" \
    'set -g default-command "reattach-to-user-namespace -l $SHELL"'

# ─── FZF Integration (tmux-fzf) ────────────────────────────────────
set -g @tmux-fzf-open-key 'C-Space'
set -g @tmux-fzf-bind-copy 'y'
set -g @tmux-fzf-layout 'full'

# ─── Session Management ───────────────────────────────────────────────
# New session popup
bind C-c display-popup -w 60% -h 40% "read -p 'Session name: ' name; tmux new-session -d -s \$name && tmux switch-client -t \$name"

# ─── Status Bar (Catppuccin handled by plugin) ───────────────────────
set -g status-position top
set -g status-interval 1
set -g status-left-length 50
set -g status-right-length 80

# ─── Misc ────────────────────────────────────────────────────────────
set -g visual-activity off
set -g monitor-activity off
set -g automatic-rename on
set -g allow-rename on

# ─── Initialize TPM ───────────────────────────────────────────────────
run '~/.config/tmux/plugins/tpm/tpm'
